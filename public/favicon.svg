<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090C" />
    </linearGradient>
    <linearGradient id="fav-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BC64" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A67B28" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background Card with Theme Accent Border -->
  <rect width="100" height="100" rx="24" fill="url(#fav-bg)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="22.5" fill="none" stroke="url(#fav-border)" stroke-width="3" />
  <!-- Farhan Aslam Brand Logo -->
  <image href="data:image/png;base64," x="6" y="15" width="88" height="70" preserveAspectRatio="xMidYMid meet" />
</svg>
